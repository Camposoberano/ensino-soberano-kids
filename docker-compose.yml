services:
  ensino-soberano-kids:
    build:
      context: .
      dockerfile: Dockerfile
    image: ensino-soberano-kids:latest
    container_name: ensino-soberano-kids
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - TZ=America/Sao_Paulo
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M

    # ── LABELS PARA O TRAEFIK (soberano.pro) ──
    # Já configurado para o subdomínio oficial https://kids.soberano.pro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kids-soberano.rule=Host(`kids.soberano.pro`)"
      - "traefik.http.routers.kids-soberano.entrypoints=websecure"
      - "traefik.http.routers.kids-soberano.tls=true"
      - "traefik.http.routers.kids-soberano.tls.certresolver=letsencrypt"
      - "traefik.http.services.kids-soberano.loadbalancer.server.port=80"

    # Se o Traefik estiver em uma rede externa (ex: traefik_public ou proxy), descomente:
    # networks:
    #   - traefik_public

# networks:
#   traefik_public:
#     external: true
