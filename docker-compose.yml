version: '3.8'

services:
  ensino-soberano-kids:
    image: ghcr.io/camposoberano/ensino-soberano-kids:latest
    networks:
      - camposoberano
    environment:
      - TZ=America/Sao_Paulo
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.kids-soberano.rule=Host(`kids.soberano.pro`)"
        - "traefik.http.routers.kids-soberano.entrypoints=websecure"
        - "traefik.http.routers.kids-soberano.tls=true"
        - "traefik.http.routers.kids-soberano.tls.certresolver=letsencrypt"
        - "traefik.http.services.kids-soberano.loadbalancer.server.port=80"
        - "traefik.docker.network=camposoberano"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kids-soberano.rule=Host(`kids.soberano.pro`)"
      - "traefik.http.routers.kids-soberano.entrypoints=websecure"
      - "traefik.http.routers.kids-soberano.tls=true"
      - "traefik.http.routers.kids-soberano.tls.certresolver=letsencrypt"
      - "traefik.http.services.kids-soberano.loadbalancer.server.port=80"
      - "traefik.docker.network=camposoberano"

networks:
  camposoberano:
    external: true
